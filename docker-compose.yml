services:
  time-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-tracker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"     # Hermes и локальные инструменты
      - "10.66.66.2:8000:8000"    # только AWG-туннель: сюда ходит nginx с VPS
    volumes:
      - ./data:/data
